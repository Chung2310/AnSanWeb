name: Docker image check

on:
  push:
    branches: ['codex/ansan-docker-*']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: docker-image-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-check:
    name: Build, measure and start ansan image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASELINE_IMAGE: ghcr.io/chung2310/ansanweb:production
      CHECK_IMAGE: igen-ansan:image-check
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Measure production baseline
        id: baseline
        run: |
          docker pull "$BASELINE_IMAGE"
          echo "bytes=$(docker image inspect --format '{{.Size}}' "$BASELINE_IMAGE")" >> "$GITHUB_OUTPUT"
          docker image rm "$BASELINE_IMAGE"

      - uses: docker/setup-buildx-action@v3

      - name: Build image without publishing or deploying
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ env.CHECK_IMAGE }}
          cache-from: type=gha,scope=ansan-image-check
          cache-to: type=gha,mode=max,scope=ansan-image-check

      - name: Measure image
        env:
          BASELINE_BYTES: ${{ steps.baseline.outputs.bytes }}
        run: |
          image_bytes=$(docker image inspect --format '{{.Size}}' "$CHECK_IMAGE")
          printf 'image_bytes=%s\nbaseline_bytes=%s\n' "$image_bytes" "$BASELINE_BYTES" | tee image-size.txt
          test "$image_bytes" -lt "$BASELINE_BYTES"
          cat image-size.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Check runtime dependencies
        run: |

          docker run --rm --network none --entrypoint sh "$CHECK_IMAGE" -ec '
            test "$(id -u)" = 1001
            test ! -d .next/cache
            test ! -d node_modules/genkit-cli
            test -f .next/BUILD_ID
            node_modules/.bin/tsx --version
            node -e "for(const n of [\"next\",\"express\",\"mongoose\",\"swagger-ui-express\"]) require(n)"
            du -sh node_modules .next
          '

      - name: Start app with isolated test database
        run: |
          docker network create --internal image-check
          docker run -d --network image-check --name image-check-db mongo:4.4
          docker run -d --network image-check --name image-check-redis redis:7-alpine
          docker run -d --network image-check --name image-check-app \
            -e MONGODB_URI=mongodb://image-check-db:27017/image_check \
            -e JWT_ACCESS_SECRET=image-check-access-secret-not-production \
            -e JWT_REFRESH_SECRET=image-check-refresh-secret-not-production \
            -e CLOUDINARY_CLOUD_NAME=image-check \
            -e CLOUDINARY_API_KEY=image-check \
            -e CLOUDINARY_API_SECRET=image-check \
            -e REDIS_URL=redis://image-check-redis:6379 \
            -e REDIS_HOST=image-check-redis \
            "$CHECK_IMAGE"
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec image-check-app node -e 'fetch("http://127.0.0.1:3006/api/v1/health", {signal:AbortSignal.timeout(3000)}).then(async r=>{const d=await r.json();if(!r.ok||d.status!=="ok"||!(d.database==="connected"||String(d.services?.database).startsWith("online")))process.exit(1)}).catch(()=>process.exit(1))'; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          docker exec -i image-check-app node <<'NODE'
          (async () => {
            const base = 'http://127.0.0.1:3006';
            for (const path of ['/', '/api/v1/health', '/api-docs/']) {
              const r = await fetch(base + path, {signal: AbortSignal.timeout(10000)});
              if (!r.ok) throw Error(path + ': HTTP ' + r.status);
              const text = await r.text();
              if (path === '/') {
                if (!/<html/i.test(text)) throw Error('Missing frontend HTML');
                const asset = text.match(/src="([^"]+\.js[^"]*)"/);
                if (!asset) throw Error('Missing frontend script');
                const script = await fetch(new URL(asset[1].replaceAll('&amp;', '&'), base));
                if (!script.ok) throw Error('Frontend script unavailable');
              }
              console.log(path + ': OK');
            }
          })().catch(e => { console.error(e.message); process.exit(1); });
          NODE

      - name: Collect test logs and remove test containers
        if: always()
        run: |
          docker logs image-check-app > image-smoke-test.txt 2>&1 || true
          docker rm -f image-check-app image-check-db image-check-redis || true
          docker network rm image-check || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ansan-docker-image-check
          path: |
            image-size.txt
            image-smoke-test.txt
          retention-days: 7

