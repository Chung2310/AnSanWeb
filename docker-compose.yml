services:
  ansanweb:
    image: ghcr.io/chung2310/ansanweb:latest
    build: .
    restart: always
    ports:
      - "3006:3006"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3006
      HOSTNAME: 0.0.0.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
